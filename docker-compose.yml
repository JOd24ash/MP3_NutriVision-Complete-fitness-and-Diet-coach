services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:///./nutrivision.db
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./checkpoints:/checkpoints:ro
      - nutrivision-data:/app/data
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]
volumes:
  nutrivision-data:
